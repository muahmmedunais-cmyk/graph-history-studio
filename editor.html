<style>
:root{--bg:#101114;--panel:#17191e;--panel2:#20232a;--line:#30343d;--text:#f4f5f7;--muted:#9ba1ad;--accent:#b9f36b;--accentInk:#17200d;--danger:#ff7777}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px 'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#252830;color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:#68734f}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:800}.quiet{background:transparent}.danger{color:var(--danger)}.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#14161a;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}.brand img{display:block;width:154px;height:auto;max-height:42px;object-fit:contain;border-radius:3px}.brand span{font:600 9px 'DM Sans';letter-spacing:1.6px;color:#9ba1ad}.project{width:min(220px,25vw);background:transparent;border:0;color:white;font-weight:700;padding:8px}.topright{margin-left:auto;display:flex;gap:7px;align-items:center}.topright button{white-space:nowrap}.status{font-size:11px;color:var(--muted);margin-right:5px}.layout{height:calc(100dvh - 58px);display:grid;grid-template-columns:68px minmax(0,1fr) 290px;min-height:0}.rail{background:#15171b;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:6px}.tool{width:54px;height:53px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#c4c8d0;font-size:10px}.tool i{font-style:normal;font-size:19px}.tool.active,.tool:hover{background:#2b3023;color:var(--accent)}.work{min-width:0;display:flex;flex-direction:column}.bar{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:#15171b}.bar .spacer{flex:1}.bar small{color:var(--muted)}.stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px;background-color:#111318;background-image:radial-gradient(#30343d 1px,transparent 1px);background-size:18px 18px;touch-action:pan-x pan-y}.canvas-wrap{position:relative;box-shadow:0 16px 55px #0009;flex:none}.canvas-container{display:block!important}.canvas-container canvas{touch-action:none}.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}.panel h3{font:700 11px 'Space Grotesk';letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:8px 0 13px}.panel section{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input:not([type=color]):not([type=range]),.field select,.field textarea{width:100%;background:#101216;border:1px solid var(--line);border-radius:8px;color:white;padding:9px;min-width:0}.field input[type=color]{width:100%;height:35px;background:#101216;border:1px solid var(--line);border-radius:8px;padding:2px}.field input[type=range]{width:100%;accent-color:var(--accent)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.wide{width:100%}.hint{color:var(--muted);font-size:11px;line-height:1.5}.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:12px}.layers{display:flex;flex-direction:column;gap:5px}.layer{display:flex;align-items:center;gap:6px;padding:7px;background:#111318;border:1px solid var(--line);border-radius:8px;min-width:0}.layer.sel{border-color:var(--accent);background:#252b1e}.layer .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.layer button{padding:4px 6px;border:0;background:transparent}.drawer{display:none}.mobile-tabs{display:none}.modal-back{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(520px,100%);max-height:85dvh;overflow:auto;background:#1a1d23;border:1px solid var(--line);border-radius:16px;padding:18px}.modal h2{font:700 18px 'Space Grotesk';margin:0 0 14px}.modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.template{padding:14px;text-align:left;min-height:82px}.template strong{display:block;margin-bottom:5px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e8f6d5;color:#18200f;padding:10px 16px;border-radius:30px;font-weight:700;z-index:40;display:none;box-shadow:0 8px 25px #0007}
@media(max-width:850px){.layout{grid-template-columns:1fr;height:calc(100dvh - 58px)}.rail{display:none}.panel{display:none}.top{padding:0 9px;gap:6px}.brand img{width:105px;max-height:31px}.brand span{font-size:7px;letter-spacing:1px}.project{width:100px;font-size:12px}.topright{gap:4px}.topright button{padding:8px;font-size:11px}.status{display:none}.bar{height:43px}.stage{padding:14px 8px 78px;align-items:center}.mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:#17191e;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:5px}.mobile-tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#c5c9d0;min-width:55px}.mobile-tabs button span:first-child{font-size:19px}.drawer{display:block;position:fixed;z-index:15;left:0;right:0;bottom:62px;max-height:64dvh;overflow:auto;background:#191c22;border-top:1px solid #454b55;border-radius:16px 16px 0 0;padding:16px;transform:translateY(110%);transition:transform .22s ease}.drawer.open{transform:translateY(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.drawer-head strong{font:700 14px 'Space Grotesk'}.drawer .panel-content{display:block}.canvas-container{max-width:none!important}.topright .hide-mobile{display:none}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvasEl=$('designCanvas');
if(!window.fabric){alert('The editor needs an internet connection to load its canvas engine.');return;}
const canvas=new fabric.Canvas(canvasEl,{backgroundColor:'#ffffff',preserveObjectStacking:true,selection:true,stopContextMenu:true});
canvas.setWidth(1080);canvas.setHeight(1350);
let zoom=0.45,history=[],future=[],restoring=false,autosaveTimer=null,activeDrawer='';const MAX_HISTORY=45;
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)};
const snapshot=()=>JSON.stringify({version:1,name:$('projectName').value,width:canvas.getWidth(),height:canvas.getHeight(),background:canvas.backgroundColor,objects:canvas.toJSON(['name','assetName','customType'])});
function pushHistory(){if(restoring)return;const s=snapshot();if(history[history.length-1]!==s)history.push(s);if(history.length>MAX_HISTORY)history.shift();future=[];updateHistoryButtons();scheduleAutosave();}
function applySnapshot(s){restoring=true;const d=typeof s==='string'?JSON.parse(s):s;$('projectName').value=d.name||'Untitled design';canvas.setDimensions({width:d.width||1080,height:d.height||1350});canvas.backgroundColor=d.background||'#fff';canvas.loadFromJSON(d,()=>{canvas.renderAll();restoring=false;fitCanvas();renderLayers();renderProperties();updateInfo();});}
function undo(){if(history.length<2)return;future.push(history.pop());applySnapshot(history[history.length-1]);updateHistoryButtons()}
function redo(){if(!future.length)return;const s=future.pop();history.push(s);applySnapshot(s);updateHistoryButtons()}
function updateHistoryButtons(){$('undoBtn').disabled=history.length<2;$('redoBtn').disabled=!future.length}
function scheduleAutosave(){clearTimeout(autosaveTimer);$('saveStatus').textContent='Unsaved changes';autosaveTimer=setTimeout(()=>{try{localStorage.setItem('ghs_autosave',snapshot());$('saveStatus').textContent='Autosaved locally';}catch(e){$('saveStatus').textContent='Storage full';}},700)}
function saveProject(){try{localStorage.setItem('ghs_autosave',snapshot());$('saveStatus').textContent='Saved locally';toast('Project saved on this device');}catch(e){toast('Device storage is full. Export a project file.');}}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportProject(){const blob=new Blob([snapshot()],{type:'application/json'});download(blob,safeName()+'.ghs');}
function safeName(){return ($('projectName').value||'design').replace(/[^\w-]+/g,'-').slice(0,60)}
function openProject(){ $('projectFile').click(); }
$('projectFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());history=[];future=[];applySnapshot(d);setTimeout(()=>{history=[snapshot()];updateHistoryButtons();},250);toast('Project opened');}catch(err){toast('Invalid project file');}e.target.value='';});
function addObject(obj){pushHistory();canvas.add(obj);canvas.setActiveObject(obj);canvas.requestRenderAll();renderProperties();renderLayers();}
function addText(){const t=new fabric.IText('Your headline',{left:100,top:120,fontFamily:'Space Grotesk',fontSize:76,fontWeight:'bold',fill:'#17191e',lineHeight:1.1,editable:true});t.name='Text';addObject(t);}
function addShape(type){let o;if(type==='rect')o=new fabric.Rect({left:130,top:150,width:360,height:230,fill:'#b9f36b',rx:0,ry:0});if(type==='circle')o=new fabric.Circle({left:150,top:150,radius:115,fill:'#b9f36b'});if(type==='triangle')o=new fabric.Triangle({left:150,top:150,width:240,height:220,fill:'#b9f36b'});if(type==='line')o=new fabric.Line([100,200,550,200],{stroke:'#17191e',strokeWidth:6});if(type==='star')o=new fabric.Polygon(Array.from({length:10},(_,i)=>{const r=i%2?48:105,a=-Math.PI/2+i*Math.PI/5;return{x:110+r*Math.cos(a),y:110+r*Math.sin(a)}}),{left:150,top:150,fill:'#b9f36b'});o.name=type[0].toUpperCase()+type.slice(1);addObject(o);}
function addImages(files){[...files].forEach(file=>{if(!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>fabric.Image.fromURL(reader.result,img=>{const maxW=canvas.getWidth()*.72,maxH=canvas.getHeight()*.72;img.scale(Math.min(maxW/img.width,maxH/img.height,1));img.set({left:(canvas.getWidth()-img.getScaledWidth())/2,top:(canvas.getHeight()-img.getScaledHeight())/2});img.name=file.name;img.assetName=file.name;addObject(img);},{crossOrigin:'anonymous'});reader.readAsDataURL(file);});}
$('imageFiles').addEventListener('change',e=>{if(e.target.files.length)addImages(e.target.files);e.target.value='';});
function uploadImage(){ $('imageFiles').click(); }
function addFont(){ $('fontFile').click(); }
$('fontFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const family=f.name.replace(/\.[^.]+$/,'').replace(/[^\w -]/g,'');try{const face=new FontFace(family,`url(${URL.createObjectURL(f)})`);await face.load();document.fonts.add(face);const o=canvas.getActiveObject();if(o&&o.type==='i-text'){pushHistory();o.set('fontFamily',family);canvas.requestRenderAll();renderProperties();}toast('Font loaded for this session');}catch(err){toast('Could not load this font');}e.target.value='';});
function setCanvasSize(w,h){w=Math.max(100,Math.min(4000,Math.round(+w)));h=Math.max(100,Math.min(4000,Math.round(+h)));if(!w||!h)return;pushHistory();canvas.setDimensions({width:w,height:h});canvas.requestRenderAll();updateInfo();fitCanvas();}
function fitCanvas(){const stage=$('stage'),pad=30,scale=Math.min((stage.clientWidth-pad)/(canvas.getWidth()),(stage.clientHeight-pad)/(canvas.getHeight()),1);zoom=Math.max(.08,scale);canvas.setZoom(zoom);canvas.setWidth(canvas.getWidth());canvas.setHeight(canvas.getHeight());canvas.calcOffset();$('zoomLabel').textContent=Math.round(zoom*100)+'%';}
function setZoom(z){zoom=Math.max(.08,Math.min(2,z));canvas.setZoom(zoom);canvas.calcOffset();$('zoomLabel').textContent=Math.round(zoom*100)+'%';}
function updateInfo(){$('canvasInfo').textContent=canvas.getWidth()+' × '+canvas.getHeight()+' px';}
function selected(){return canvas.getActiveObject()}
function moveLayer(obj, direction){
 if(!obj || !canvas.getObjects().includes(obj)){toast('Select a layer first');return;}
 const objects=canvas.getObjects(), current=objects.indexOf(obj), last=objects.length-1;
 let target=current;
 if(direction==='front') target=last;
 else if(direction==='back') target=0;
 else if(direction==='forward') target=Math.min(last,current+1);
 else if(direction==='backward') target=Math.max(0,current-1);
 if(target===current){toast(direction==='front'?'Already at the front':direction==='back'?'Already at the back':'Layer cannot move further');return;}
 pushHistory();
 canvas.moveTo(obj,target);
 canvas.setActiveObject(obj);
 canvas.requestRenderAll();
 renderProperties();
 renderLayers();
 renderMobileLayers();
}
function renderProperties(){const o=selected(),root=document.createElement('div');root.innerHTML=`
<section><h3>Properties</h3><div id="noObj" class="empty">Select an object on the canvas to edit it.</div><div id="objProps" style="display:none">
<div class="field"><label>Layer name</label><input id="pName"></div>

<div class="two"><div class="field"><label>Width</label><input id="pW" type="number"></div><div class="field"><label>Height</label><input id="pH" type="number"></div></div>
<div class="field"><label>Opacity</label><input id="pOpacity" type="range" min="0" max="1" step=".01"></div>
<div class="field"><label>Blend mode</label><select id="pBlend"><option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="darken">Darken</option><option value="lighten">Lighten</option><option value="color-dodge">Color Dodge</option><option value="color-burn">Color Burn</option><option value="difference">Difference</option></select></div>
<div id="textProps"><div class="field"><label>Text</label><textarea id="pText" rows="3"></textarea></div><div class="field"><label>Font family</label><select id="pFont"><option>Space Grotesk</option><option>DM Sans</option><option>Arial</option><option>Georgia</option><option>Impact</option><option>Times New Roman</option><option>Courier New</option><option>Verdana</option></select></div><div class="two"><div class="field"><label>Size</label><input id="pSize" type="number" min="1" max="800"></div><div class="field"><label>Color</label><input id="pColor" type="color"></div></div><div class="three"><button id="pBold"><b>B</b></button><button id="pItalic"><i>I</i></button><button id="pUnder"><u>U</u></button></div><div class="two"><div class="field"><label>Letter spacing</label><input id="pSpacing" type="number"></div><div class="field"><label>Line height</label><input id="pLine" type="number" step=".1"></div></div><div class="field"><label>Alignment</label><select id="pAlign"><option>left</option><option>center</option><option>right</option><option>justify</option></select></div></div>
<div id="fillProps"><div class="field"><label>Fill</label><input id="pFill" type="color"></div><div class="field"><label>Stroke</label><input id="pStroke" type="color"></div><div class="field"><label>Stroke width</label><input id="pStrokeW" type="number" min="0" max="100"></div></div>
<div id="imageProps"><div class="field"><label>Image filters</label><div class="two"><button id="filterGray">Grayscale</button><button id="filterSepia">Sepia</button><button id="filterBright">Brighten</button><button id="filterReset">Reset filters</button></div></div><div class="field"><label>Brightness</label><input id="pBright" type="range" min="-.5" max=".5" step=".01"></div><div class="two"><button id="flipX">Flip horizontal</button><button id="flipY">Flip vertical</button></div></div>
<hr><div class="two"><button id="duplicate">Duplicate</button><button id="delete" class="danger">Delete</button></div>
</div></section>
<section><h3>Canvas</h3><div class="field"><label>Preset</label><select id="canvasPreset"><option value="1080,1350">Instagram portrait · 1080×1350</option><option value="1080,1080">Square · 1080×1080</option><option value="1080,1920">Story / Reel · 1080×1920</option><option value="1280,720">YouTube thumbnail · 1280×720</option><option value="1920,1080">Landscape · 1920×1080</option><option value="794,1123">A4 portrait · 794×1123</option><option value="1123,1587">A3 portrait · 1123×1587</option></select></div><div class="two"><div class="field"><label>Width</label><input id="cw" type="number" value="${canvas.getWidth()}"></div><div class="field"><label>Height</label><input id="ch" type="number" value="${canvas.getHeight()}"></div></div><div class="field"><label>Background</label><input id="bg" type="color" value="${colorHex(canvas.backgroundColor)||'#ffffff'}"></div><button id="applySize" class="wide">Apply canvas size</button></section>
<section><h3>Layers</h3><div class="layers" id="layersList"></div><div class="two" style="margin-top:8px"><button id="layerFront">⇈ Bring to Front</button><button id="layerBack">⇊ Send to Back</button><button id="layerUp">↑ Forward</button><button id="layerDown">↓ Backward</button></div></section>
<section><h3>Creative Libraries</h3><button id="openTemplates" class="wide">Browse 100 professional templates</button><button id="openElements" class="wide" style="margin-top:7px">Browse Elements & Mockups</button><div class="field"><label>50 English font styles</label><select id="quickFont"><option>Anton</option><option>Archivo Black</option><option>Barlow Condensed</option><option>Bebas Neue</option><option>Cinzel</option><option>DM Sans</option><option>DM Serif Display</option><option>Fjalla One</option><option>Great Vibes</option><option>League Spartan</option><option>Libre Baskerville</option><option>Manrope</option><option>Montserrat</option><option>Oswald</option><option>Playfair Display</option><option>Poppins</option><option>Raleway</option><option>Roboto Condensed</option><option>Russo One</option><option>Space Grotesk</option><option>Space Mono</option><option>Teko</option><option>Ubuntu</option><option>Work Sans</option><option>Abril Fatface</option><option>Alfa Slab One</option><option>Bodoni Moda</option><option>Cormorant Garamond</option><option>Dancing Script</option><option>Fira Sans</option><option>Josefin Sans</option><option>Lobster</option><option>Merriweather</option><option>Mulish</option><option>Nunito</option><option>Old Standard TT</option><option>Outfit</option><option>Pacifico</option><option>Philosopher</option><option>Prata</option><option>Quicksand</option><option>Righteous</option><option>Satisfy</option><option>Source Sans 3</option><option>Special Elite</option><option>Syne</option><option>Urbanist</option><option>Vollkorn</option><option>Yanone Kaffeesatz</option><option>Zilla Slab</option></select></div></section><section><h3>Project</h3><div class="two"><button id="exportProject">Export project</button><button id="openProject">Open project</button></div><p class="hint">Projects are saved in this browser on this device. Export a .ghs file to move a project to another device.</p></section>`;
$('desktopPanelContent').replaceChildren(root);const fontSelect=root.querySelector('#pFont');if(fontSelect){fontSelect.innerHTML=FONT_FAMILIES.map(f=>'<option value="'+f+'">'+f+'</option>').join('');}wireProperties(root);renderLayers();
}
function colorHex(v){if(typeof v==='string'&&v[0]==='#')return v;return '#ffffff'}
function bind(id,fn,event='change'){const el=$(id);if(el)el.addEventListener(event,fn)}

const ELEMENTS=[['Icons','✦','★','✧','♥','◆','●','➤','✓','＋','⌁'],['PNG Graphics','◉','✺','✷','✹','✧','❖','✿','✦','⬟','⬢'],['Overlays','☼','✴','✦','〰','☁','◌','✧','✺','✹','⋆'],['Stickers','NEW','SALE','LIMITED','HOT','WOW','LOVE','2026','★','TOP','EDIT'],['Frames','□','▢','▣','▤','▥','▦','▧','▨','▩','◇'],['Mockup Scenes','POSTER','BILLBOARD','PHONE','BOOK','PACKAGE','T-SHIRT','CARD','MAGAZINE','SIGN','SCREEN']];
function addElement(label,cat,idx){const W=canvas.getWidth(),H=canvas.getHeight(),color=['#b9f36b','#ffffff','#e8c99a','#ff6b6b','#9bc7ff'][idx%5];pushHistory();let obj;if(cat==='Stickers'){obj=new fabric.Textbox(label,{left:W*.25,top:H*.35,width:W*.5,fontFamily:'Anton',fontSize:70,fill:color,backgroundColor:'#17191e',textAlign:'center',fontWeight:'bold',padding:14});}else if(cat==='Frames'){obj=new fabric.Rect({left:W*.18,top:H*.18,width:W*.64,height:H*.64,fill:'transparent',stroke:color,strokeWidth:Math.max(4,W*.009)});}else if(cat==='Mockup Scenes'){obj=new fabric.Group([new fabric.Rect({left:0,top:0,width:W*.48,height:H*.62,fill:'#d9d9d9',rx:8,ry:8,shadow:new fabric.Shadow({color:'#0008',blur:22,offsetX:8,offsetY:12})}),new fabric.Rect({left:W*.035,top:H*.035,width:W*.41,height:H*.55,fill:'#26372e'}),new fabric.Textbox('YOUR\nDESIGN',{left:W*.07,top:H*.21,width:W*.34,fontFamily:'Anton',fontSize:W*.055,fill:'#fff',textAlign:'center'})],{left:W*.26,top:H*.18});}else{const sym=label;obj=new fabric.Textbox(sym,{left:W*.32,top:H*.32,width:W*.36,fontFamily:'Arial',fontSize:Math.min(W*.24,240),fill:color,textAlign:'center',fontWeight:'bold'});}obj.name=cat+' · '+label;canvas.add(obj);canvas.setActiveObject(obj);canvas.requestRenderAll();renderProperties();renderLayers();toast('Added '+label);}
function showElementsLibrary(){const m=$('modal');m.style.width='min(850px,100%)';m.innerHTML='<h2>Elements Library</h2><p class="hint">Editable starter graphics and mockup scene elements. Upload your own transparent PNGs for photographic assets.</p><div id="elementCats" style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0"></div><div id="elementGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px"></div><p class="hint" style="margin-top:12px">Mockup scenes here are editable compositional mockups, not perspective smart-object replacements. PNG transparency is preserved when you upload PNG files.</p><p style="text-align:right"><button id="elementUpload">Upload PNG / SVG / Image</button> <button id="elementClose">Close</button></p>';$('modalBack').style.display='flex';let active='Icons';const cats=$('elementCats');ELEMENTS.forEach(([cat])=>{const b=document.createElement('button');b.textContent=cat;b.onclick=()=>{active=cat;draw()};cats.append(b)});function draw(){const g=$('elementGrid');g.innerHTML='';const items=ELEMENTS.find(x=>x[0]===active).slice(1);items.forEach((v,i)=>{const b=document.createElement('button');b.style.minHeight='86px';b.innerHTML='<div style="font-size:27px;font-weight:700;margin-bottom:6px">'+v+'</div><small>'+active+'</small>';b.onclick=()=>addElement(v,active,i);g.append(b)})}bind('elementUpload',uploadImage);bind('elementClose',closeModal);draw();}

function exportImage(format='png'){const old=canvas.getZoom();canvas.discardActiveObject();canvas.renderAll();const data=canvas.toDataURL({format,multiplier:1,quality:.92});const a=document.createElement('a');a.href=data;a.download=safeName()+'.'+format;a.click();canvas.setZoom(old);canvas.requestRenderAll();toast(format.toUpperCase()+' exported');}
function showExport(){const m=$('modal');m.innerHTML='<h2>Export your design</h2><p class="hint">Export at the canvas dimensions. Transparent PNG is available when the canvas background is removed in a future build; this version exports the current background.</p><div class="grid"><button id="exPng"><strong>PNG</strong><br><small>Lossless image</small></button><button id="exJpg"><strong>JPG</strong><br><small>Smaller file</small></button><button id="exSvg"><strong>SVG</strong><br><small>Vector-capable objects</small></button><button id="exProject"><strong>Project</strong><br><small>Editable .ghs file</small></button></div><p style="text-align:right;margin:16px 0 0"><button id="exClose">Close</button></p>';$('modalBack').style.display='flex';bind('exPng',()=>{exportImage('png');closeModal()});bind('exJpg',()=>{exportImage('jpeg');closeModal()});bind('exSvg',()=>{download(new Blob([canvas.toSVG()],{type:'image/svg+xml'}),safeName()+'.svg');closeModal()});bind('exProject',()=>{exportProject();closeModal()});bind('exClose',closeModal);}
function closeModal(){$('modalBack').style.display='none'}$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});
$('exportBtn').onclick=showExport;$('saveBtn').onclick=saveProject;$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('zoomIn').onclick=()=>setZoom(zoom*1.15);$('zoomOut').onclick=()=>setZoom(zoom/1.15);$('fitBtn').onclick=fitCanvas;
document.querySelectorAll('.rail [data-tool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rail .tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.tool;if(t==='image')uploadImage();if(t==='text')addText();if(t==='shapes')openDrawer('add');if(t==='templates')showTemplateLibrary();if(t==='elements')showElementsLibrary();if(t==='layers')openDrawer('layers');});
canvas.on('selection:created',()=>{renderProperties();renderLayers()});canvas.on('selection:updated',()=>{renderProperties();renderLayers()});canvas.on('selection:cleared',()=>{renderProperties();renderLayers()});canvas.on('object:modified',()=>{pushHistory();renderProperties();renderLayers()});canvas.on('object:added',()=>{if(!restoring){renderLayers();scheduleAutosave()}});canvas.on('object:removed',()=>{if(!restoring){renderLayers();scheduleAutosave()}});
$('projectName').addEventListener('input',scheduleAutosave);
// Font families are loaded on demand to keep the editor lighter.

window.addEventListener('resize',fitCanvas);
canvas.backgroundColor='#ffffff';history=[snapshot()];renderProperties();renderLayers();updateInfo();
try{const saved=localStorage.getItem('ghs_autosave');if(saved&&confirm('Restore your last autosaved Graph.History Studio project?')){applySnapshot(saved);setTimeout(()=>{history=[snapshot()];updateHistoryButtons()},350);}}catch(e){}
requestAnimationFrame(fitCanvas);
})();
</script>
</body></html>
